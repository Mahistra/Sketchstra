<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mahistra since 2025">
  <defs>
    <linearGradient id="goldb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a6a00"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff1b8"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6a00"/>
      <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="-0.5" y1="0" x2="1.5" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      <animate attributeName="x1" values="-0.5;1.5" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="784" height="144" rx="18" fill="url(#goldb)" stroke="#3a2c00" stroke-width="2"/>
  <rect x="18" y="18" width="764" height="124" rx="12" fill="url(#shine)"/>
  <rect x="18" y="18" width="764" height="124" rx="12" fill="none" stroke="#fff1b8" stroke-width="1" opacity="0.5"/>

  <g fill="#fff1b8">
    <circle cx="60" cy="60" r="3">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="100" r="3">
      <animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="400" y="76" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="bold" fill="#0a0a0d">MAHISTRA</text>
  <text x="400" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="8" font-weight="600" fill="#3a2c00">SINCE 2025</text>
</svg>