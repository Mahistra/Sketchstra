<svg width="800" height="20" viewBox="0 0 800 20" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="divider">
  <defs>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff1b8"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
      <animate attributeName="x1" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="10" x2="800" y2="10" stroke="url(#gd)" stroke-width="2"/>
  <circle cx="400" cy="10" r="6" fill="#f5d76e">
    <animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>